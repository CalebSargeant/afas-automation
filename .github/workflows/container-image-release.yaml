name: Build Container Image

# This workflow:
# 1. Builds PR images on pull request events (tagged as pr-<number>)
# 2. When semantic-release creates a release, promotes the PR image to the
#    release version (no rebuild) if its digest is still current
#
# Copied from fortivpn-gateway. Two deliberate differences:
#   - platforms is linux/amd64,linux/arm64. deskbird-booking writes
#     "linux/amd64,arm64", which is NOT a valid platform list - buildx reads the
#     second element as an OS, so that build silently produces amd64 only.
#     arm64 is the target here (the OCI cloud tier is 4x arm64 2-CPU nodes), so
#     getting this wrong would ship an image the cluster cannot run.
#   - the reusable workflow is SHA-pinned rather than tag-pinned.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v1.0.0). Empty means the latest tag.'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write


jobs:
  docker:
    uses: calebsargeant/reusable-workflows/.github/workflows/docker-bake-ghcr.yaml@98676cf3b495f978b1f9dbe22719d7cbd293b5b1 # v1.15.0
    with:
      image_name: afas-declaraties
      # Must be named explicitly. The promote step lists the bake targets and,
      # for any target whose name differs from bake_target, promotes
      # <image_name>-<target> -- the multi-image convention fortivpn-gateway
      # relies on for its cookie/vpn/bgp images. bake_target defaults to
      # "default", our group resolves to the single target "app", so the release
      # looked for afas-declaraties-app:pr-N while the build had pushed
      # afas-declaraties:pr-N, and every promotion failed with "not found".
      bake_target: app
      platforms: linux/amd64,linux/arm64
      push: true
      force_version: ${{ github.event.release.tag_name || github.event.inputs.version || '' }}
    secrets: inherit
