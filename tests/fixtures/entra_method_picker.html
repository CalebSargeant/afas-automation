<!doctype html>
<!--
  Entra's method picker, "Bevestig uw identiteit". Ids and proof types follow
  Entra's SAOTCS pane; labels are Dutch and phone digits are replaced.
-->
<html lang="nl">
<head><meta charset="utf-8"><title>Aanmelden bij uw account</title></head>
<body>
<div id="lightbox">
  <div id="idDiv_SAOTCS_Title" class="row text-title" role="heading" aria-level="1">Bevestig uw identiteit</div>
  <div id="idDiv_SAOTCS_Proofs" role="list">
    <div class="tile" role="listitem">
      <div class="table" role="button" tabindex="0" data-value="PhoneAppNotification">
        <div class="table-cell text-left content">Een aanvraag goedkeuren in mijn Microsoft Authenticator-app</div>
      </div>
    </div>
    <div class="tile" role="listitem">
      <div class="table" role="button" tabindex="0" data-value="PhoneAppOTP">
        <div class="table-cell text-left content">Een verificatiecode gebruiken</div>
      </div>
    </div>
    <div class="tile" role="listitem">
      <div class="table" role="button" tabindex="0" data-value="OneWaySMS">
        <div class="table-cell text-left content">Sms naar &lt;PLACEHOLDER&gt;</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
